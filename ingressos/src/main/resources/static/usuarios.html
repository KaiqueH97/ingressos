<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Usuários - Sistema de Ingressos</title>
    <style>
        /* Tipografia e Fundo mais modernos */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #e9ecef; color: #343a40; }
        .container { max-width: 900px; margin: auto; }
        
        /* Cartões com sombras suaves e bordas mais arredondadas */
        .card { background: white; border: none; padding: 25px; margin-bottom: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        
        /* Títulos com nova cor e alinhamento */
        h1 { color: #2b2d42; text-align: center; border-bottom: 2px solid #edf2f4; padding-bottom: 15px; margin-bottom: 30px; letter-spacing: -0.5px; }
        h3 { color: #2b2d42; margin-top: 0; font-weight: 600; }
        
        /* Inputs com foco elegante */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #2b2d42; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; transition: border-color 0.3s, box-shadow 0.3s; }
        input:focus { border-color: #8d99ae; outline: none; box-shadow: 0 0 0 3px rgba(141, 153, 174, 0.2); }
        
        /* Botões flat design com efeito de hover */
        button, .btn { padding: 10px 15px; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; transition: opacity 0.2s, transform 0.1s;}
        button:hover, .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-success { background-color: #43aa8b; } /* Verde moderno */
        .btn-warning { background-color: #f9c74f; color: #2b2d42; } /* Amarelo estiloso */
        .btn-danger { background-color: #ef233c; } /* Vermelho vibrante */
        .btn-sm { padding: 6px 12px; font-size: 12px; margin-right: 5px; }

        /* Tabela com cabeçalho escuro e linhas zebradas sutis */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        th, td { border-bottom: 1px solid #dee2e6; padding: 12px 15px; text-align: left; }
        th { background-color: #2b2d42; color: white; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
        tr:hover { background-color: #f8f9fa; }
        
        /* Rodapé customizado */
        .footer { text-align: center; margin-top: 40px; margin-bottom: 20px; font-size: 13px; color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistema de Venda de Ingressos</h1>

    <div class="card">
        <h3>Cadastrar Novo Usuário</h3>
        <form action="/usuarios-html/salvar" method="POST">
            <div class="form-group">
                <label>Nome do Usuário:</label>
                <input type="text" name="nomeUsuario" required placeholder="Digite o nome completo">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" required placeholder="email@exemplo.com">
            </div>
            <div class="form-group">
                <label>Telefone:</label>
                <input type="text" name="telefone" placeholder="(11) 99999-9999">
            </div>
            <button type="submit" class="btn-success">Salvar Usuário</button>
        </form>
    </div>

    <div class="card">
        <h3>Usuários Cadastrados</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaUsuarios">
            </tbody>
        </table>
    </div>

    <div class="card" id="cardEdicao" style="display: none; border-left: 4px solid #f9c74f;">
        <h3>Atualizar Usuário Selecionado</h3>
        <form action="/usuarios-html/atualizar" method="POST">
            <input type="hidden" name="idUsuario" id="updIdUsuario">
            
            <div class="form-group">
                <label>Nome do Usuário:</label>
                <input type="text" name="nomeUsuario" id="updNome" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" id="updEmail" required>
            </div>
            <div class="form-group">
                <label>Telefone:</label>
                <input type="text" name="telefone" id="updTelefone">
            </div>
            <button type="submit" class="btn-warning">Confirmar Atualização</button>
            <button type="button" class="btn" style="background-color: #6c757d;" onclick="cancelarEdicao()">Cancelar</button>
        </form>
    </div>

    <div class="footer">
        Desenvolvido por Kaique Santos
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", carregarUsuarios);

    function carregarUsuarios() {
        fetch('/usuarios-html/listar')
            .then(response => response.json())
            .then(usuarios => {
                const tbody = document.getElementById('tabelaUsuarios');
                tbody.innerHTML = ''; 

                usuarios.forEach(user => {
                    const telefone = user.telefone ? user.telefone : '-';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>#${user.idUsuario}</strong></td>
                            <td>${user.nomeUsuario}</td>
                            <td>${user.email}</td>
                            <td>${telefone}</td>
                            <td>
                                <button onclick="prepararEdicao(${user.idUsuario}, '${user.nomeUsuario}', '${user.email}', '${telefone}')" class="btn-warning btn-sm">Editar</button>
                                
                                <form action="/usuarios-html/excluir" method="POST" style="display:inline;" onsubmit="return confirm('Tem certeza que deseja excluir o usuário ${user.nomeUsuario}?');">
                                    <input type="hidden" name="idUsuario" value="${user.idUsuario}">
                                    <button type="submit" class="btn-danger btn-sm">Excluir</button>
                                </form>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(error => console.error("Erro ao carregar usuários:", error));
    }

    function prepararEdicao(id, nome, email, telefone) {
        document.getElementById('updIdUsuario').value = id;
        document.getElementById('updNome').value = nome;
        document.getElementById('updEmail').value = email;
        document.getElementById('updTelefone').value = telefone === '-' ? '' : telefone;
        
        document.getElementById('cardEdicao').style.display = 'block';
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function cancelarEdicao() {
        document.getElementById('cardEdicao').style.display = 'none';
    }
</script>

</body>
</html>
